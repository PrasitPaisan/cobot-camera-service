services:
  camera_service:
    build: .
    # Required: the GigE camera's packet-size negotiation and video stream
    # (GVSP/UDP) need the container to see the host's real NIC, not a
    # virtual bridge/NAT network. Only works on a native Linux Docker host.
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./adddata:/app/adddata
    restart: unless-stopped
